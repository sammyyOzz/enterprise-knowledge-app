services:
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./apps/api/src:/app/apps/api/src