[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aurimasgriciunas", email = "griciunas.aurimas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.44.2",
    "celery[redis]>=5.7.0",
    "fastapi>=0.128.0",
    "google-genai>=1.57.0",
    "groq>=1.0.0",
    "openai>=2.15.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "tiktoken>=0.14.0",
    "uvicorn>=0.40.0",
    "watchdog[watchmedo]>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
